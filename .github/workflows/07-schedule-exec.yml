# CI de nivel 07 - Disparo schedulada através de clique

#nome da pipeline
name: 'Execução Schedule'
on:
 # schedule:
  #  - cron: '*/5 * * * *' # executa a cada 5 minutos (mínimo permitido pelo GitHub)

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - name: instalando Yarn
        run: npm install -g yarn

      - name: instalando dependendências
        run: yarn

      - name: instalando Browsers do Playwright
        run: yarn playwright install

      - name: executando testes e2e
        run: yarn run e2e

    
    
